; PHP-FPM clears the environment (clear_env = yes): variables are passed explicitly (§9.5).
[quietlink]
listen = 9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 30s
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = yes
env[APP_ENV] = prod
env[QUIETLINK_CONFIG_DIR] = $QUIETLINK_CONFIG_DIR
env[QUIETLINK_APP_SECRET_FILE] = $QUIETLINK_APP_SECRET_FILE
