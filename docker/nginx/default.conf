# TLS is terminated by the reverse proxy in front of this container (docs/README-admin.md).

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/quietlink/public;

    client_max_body_size 1408k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # No access log: URLs, addresses and user agents are not collected (ADR-0005).
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ~ /\. {
        return 404;
    }

    # Hashed, immutable frontend assets.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # The Argon2id worker is the only script allowed to compile WebAssembly (§7.5).
    location ~ ^/build/assets/argon2\.worker-[A-Za-z0-9_-]+\.js$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Operator theme tokens generated by app:boot, read-only volume.
    location ~ "^/themes/generated/(tokens\.[0-9a-f]{16}\.css)$" {
        alias /var/lib/quietlink-generated/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
}

map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https on;
}
