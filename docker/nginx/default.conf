# SPDX-License-Identifier: AGPL-3.0-or-later
# TLS is terminated by the reverse proxy in front of this container (docs/README-admin.md).

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/quietlink/public;

    client_max_body_size 1408k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    # Bodies above the buffer are spooled to the /tmp tmpfs (sized in compose.yaml for many
    # concurrent maximum-size requests); so are large responses (fastcgi_temp).
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    # No access log: URLs, addresses and user agents are not collected (ADR-0005). Error entries
    # up to crit record the client address and request line, so only emerg (startup and
    # configuration failures) is kept.
    access_log off;
    error_log /dev/stderr emerg;

    # Errors nginx answers itself get the application's problem+json body and security headers.
    error_page 400 /__errors/400.json;
    error_page 404 /__errors/404.json;
    error_page 405 /__errors/405.json;
    error_page 408 /__errors/408.json;
    error_page 413 /__errors/413.json;
    error_page 414 /__errors/414.json;

    location ^~ /__errors/ {
        internal;
        root /usr/share/quietlink;
        types { }
        default_type application/problem+json;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store, private" always;
    }

    # The front controller has one address: "/index.php" is not a second entry point.
    location ~ ^/index\.php(/|$) {
        return 404;
    }

    # Security headers are set per static location: PHP responses carry their own, and headers
    # added here too would be duplicated (a doubled Cross-Origin-Resource-Policy is ignored).
    location ~ /\. {
        return 404;
    }

    # Hashed, immutable frontend assets.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # The Argon2id worker is the only script allowed to compile WebAssembly (§7.5).
    location ~ ^/build/assets/argon2\.worker-[A-Za-z0-9_-]+\.js$ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types dompurify quietlink-worker" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Operator theme tokens generated by app:boot, read-only volume.
    location ~ "^/themes/generated/(tokens\.[0-9a-f]{16}\.css)$" {
        alias /var/lib/quietlink-generated/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # HTTPS and the client address are derived by the application from X-Forwarded-*
        # only when the connection comes from http.trusted_proxies (§9.2); never trusted here.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
}
