# SPDX-License-Identifier: AGPL-3.0-or-later
# Actions are pinned to full commit SHAs (tag in the trailing comment); see
# docs/README-developer.md, "Updating pinned dependencies".
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, sodium, openssl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit
      - run: composer qa

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run qa
      - name: Requirement coverage report is up to date
        run: node tools/traceability/coverage.mjs --check
      - name: Shared vectors are reproducible
        run: node tools/vectors/generate-sp-proto-v1.mjs --check tests/vectors/sp-proto-v1.json
      - name: Reproducible frontend build
        run: |
          find public/build -type f -exec sha256sum {} + | sort > /tmp/first.txt
          npx vite build
          find public/build -type f -exec sha256sum {} + | sort > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the secret scan covers every commit, not only the pushed range.
          fetch-depth: 0
      - run: tools/ci/forbidden-patterns.sh
      - name: No database service in compose
        run: "! grep -Eiq 'image: *(postgres|mysql|mariadb|redis|valkey|mongo)' compose.yaml"
      - name: Secret scan (whole history, .gitleaks.toml)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, sodium, openssl, mbstring
          ini-values: phar.readonly=0
          tools: box:4.7.0
      - run: composer install --no-dev --classmap-authoritative --no-interaction
      - name: Reproducible PHAR (fixed alias, commit timestamp, two identical builds)
        run: |
          jq --arg ts "$(git log -1 --format=%cI)" '.timestamp = $ts' box.json > box.release.json
          box compile --config=box.release.json --no-interaction
          sha256sum quietlink.phar > /tmp/first.txt
          box compile --config=box.release.json --no-interaction
          sha256sum --check /tmp/first.txt
      - name: The PHAR starts outside the source tree
        run: cd /tmp && php "$GITHUB_WORKSPACE/quietlink.phar" list | grep -q decrypt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: docker build -f docker/php/Dockerfile -t quietlink/app:ci .
      - run: docker build -f docker/nginx/Dockerfile -t quietlink/web:ci .
      - run: docker build -f docker/cli/Dockerfile -t quietlink/cli:ci .
      - name: Images run as non-root
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' quietlink/app:ci)" = "10001:10001"
          test "$(docker image inspect -f '{{.Config.User}}' quietlink/web:ci)" = "101"
          test "$(docker image inspect -f '{{.Config.User}}' quietlink/cli:ci)" = "10002"
      - name: Compose smoke test (documented first start, then /healthz)
        env:
          QUIETLINK_HTTP_PORT: '18080'
        run: |
          cp config/config.php.example config/config.php
          mkdir -p secrets
          docker compose build
          docker compose run --rm --no-deps -T app php bin/console app:secret:generate > secrets/app_secret
          sudo chgrp 10001 secrets/app_secret config/config.php
          chmod 640 secrets/app_secret config/config.php
          docker compose up -d --wait --wait-timeout 180
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = "200"
          docker compose exec -T app php bin/console app:config:check > /dev/null
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Compose teardown
        if: always()
        run: docker compose down -v || true
